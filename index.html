    if (t.dataset.ask) { chatSend(t.dataset.ask); return; }
    if (t.dataset.pick && LINK) { const id = t.dataset.pick; LINK.motivo = ($('#link-motivo') || {}).value || ''; LINK.sel.has(id) ? LINK.sel.delete(id) : LINK.sel.add(id); drawLink(); return; }
    const act = t.dataset.act; const dId = t.dataset.d;
    switch (act) {
      case 'demo': S = demoState(); UI.page = 'conciliacion'; UI.iaRev = null; changed(); window.scrollTo(0, 0); break;
      case 'new': if (!S.demo && S.archivos.length && !confirmInline(t)) return; S = fresh(); UI.page = 'cargar'; UI.iaRev = null; UI.ai = {}; changed(); break;
      case 'readai': readWithAI(t.dataset.arch); break;
      case 'quitar': quitarArchivo(t.dataset.arch); break;
      case 'vertodas': UI.verTodasCuentas = !UI.verTodasCuentas; render(); break;
      case 'unmatch': {
        const m = R.matches.find((x) => x.id === t.dataset.m); if (!m) return;
        if (m.tipo === 'manual') S.manual = S.manual.filter((mp) => !(mp.banco.join() === m.banco.join() && mp.libro.join() === m.libro.join()));
        else m.banco.forEach((b) => m.libro.forEach((l) => S.rechazados.push(b + '~' + l)));
        changed(); toast('Cruce deshecho. Los movimientos pasaron a Diferencias.'); break;
      }
      case 'done': S.revisados[dId] ? delete S.revisados[dId] : (S.revisados[dId] = true); persist(); render(); break;
      case 'reject': { const d = R.diffs.find((x) => x.id === dId); if (!d) return; d.banco.forEach((b) => d.libro.forEach((l) => S.rechazados.push(b + '~' + l))); changed(); toast('Separados: ahora se tratan como movimientos independientes.'); break; }
      case 'link': { const d = R.diffs.find((x) => x.id === dId); if (d) openLink(d); break; }
      case 'linkok': {
        if (!LINK || !LINK.sel.size) return;
        const motivo = ($('#link-motivo') || {}).value || '';
        const sel = [...LINK.sel];
        const bs = LINK.pickSide === 'libro' ? LINK.d.banco : sel; const ls = LINK.pickSide === 'libro' ? sel : LINK.d.libro;
        S.manual.push({ banco: bs, libro: ls, motivo: motivo ? 'Manual: ' + motivo : 'Conciliado manualmente' });
        $('#dlg').close(); LINK = null; changed(); toast('Enlace guardado.'); break;
      }
      case 'askdiff': askDiff(dId); break;
      case 'askwhy': go('asistente'); chatSend('¿Por qué no cuadra la conciliación? Revisa saldos iniciales, partidas y posibles errores de lectura.'); break;
      case 'iareview': iaReview(); break;
      case 'iaaccept': {
        const s = UI.iaRev && UI.iaRev.items[+t.dataset.i]; if (!s) return;
        S.manual.push({ banco: s.banco, libro: s.libro, motivo: 'Sugerido por IA: ' + s.motivo }); s.aplicada = true; changed(); toast('Cruce aplicado.'); break;
      }
      case 'iadismiss': { if (UI.iaRev) UI.iaRev.items.splice(+t.dataset.i, 1); render(); break; }
      case 'chatstop': UI.chatCtl && UI.chatCtl.abort(); break;
      case 'chatclear': S.chat = []; persist(); render(); break;
      case 'xlsx': exportXLSX().catch((e) => { console.error(e); toast('No se pudo generar el Excel.'); }); break;
      case 'pdf': exportPDF().catch((e) => { console.error(e); toast('No se pudo generar el PDF.'); }); break;
      case 'hidedone': UI.hideDone = t.checked; render(); break;
    }
  });
  function confirmInline(btn) {
    if (btn.dataset.armed) return true;
    btn.dataset.armed = '1'; const old = btn.textContent; btn.textContent = '¿Borrar la conciliación actual? Clic de nuevo';
    setTimeout(() => { if (btn.isConnected) { btn.textContent = old; delete btn.dataset.armed; } }, 3500);
    return false;
  }
  document.addEventListener('toggle', (ev) => {
    const d = ev.target; if (!d.matches || !d.matches('details.diff')) return;
    d.open ? UI.open.add(d.dataset.d) : UI.open.delete(d.dataset.d);
  }, true);
  document.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.dataset.file) { if (t.files && t.files.length) readFiles(t.files); t.value = ''; return; }
    if (t.dataset.sel) {
      const k = t.dataset.sel;
      if (k === 'cuenta') { S.sel.cuenta = t.value; S.sel.sugerida = null; }
      else { S.sel[k] = t.value; S.sel.cuenta = null; S.sel.sugerida = null; autoSeleccion(); }
      S.manual = []; S.rechazados = []; UI.iaRev = null; changed(); return;
    }
    if (t.dataset.opt) { S.opts[t.dataset.opt] = t.type === 'checkbox' ? t.checked : t.value; changed(); return; }
    if (t.dataset.state) { S[t.dataset.state] = t.value; persist(); render(); return; }
    if (t.dataset.map) {
      const arch = S.archivos.find((a) => a.id === t.dataset.map); if (!arch) return;
      const objId = t.dataset.obj, k = t.dataset.k;
      arch.ov = arch.ov || {};
      const o = arch.ov[objId] || (arch.ov[objId] = { map: {} });
      if (k === 'invert') o.invert = t.checked;
      else {
        o.map = o.map || {};
        o.map[k] = t.value === '' ? null : +t.value;
        if ((k === 'in' || k === 'out') && t.value !== '') o.map.monto = null;
        if (k === 'monto' && t.value !== '') { o.map.in = null; o.map.out = null; }
      }
      analizar(arch); autoSeleccion(); S.manual = []; S.rechazados = []; changed();
      return;
    }
  });

  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.dataset.nota) { S.notas[t.dataset.nota] = t.value; persist(); return; }
    if (t.id === 'rsearch') { UI.rsearch = t.value; clearTimeout(UI.rsT); UI.rsT = setTimeout(() => { const pos = t.selectionStart; render(); const n = $('#rsearch'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 220); }
  });
  document.addEventListener('submit', (ev) => {
    if (ev.target.matches('[data-act="chatform"]')) { ev.preventDefault(); const v = $('#chatIn').value; chatSend(v); }
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.target.id === 'chatIn' && ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); chatSend(ev.target.value); }
    if (ev.target.closest && ev.target.closest('[data-pick]') && (ev.key === ' ' || ev.key === 'Enter')) { ev.preventDefault(); ev.target.closest('[data-pick]').click(); }
  });
  ['dragenter', 'dragover'].forEach((type) => document.addEventListener(type, (ev) => { const z = ev.target.closest && ev.target.closest('[data-drop]'); if (z) { ev.preventDefault(); z.classList.add('over'); } }));
  ['dragleave', 'drop'].forEach((type) => document.addEventListener(type, (ev) => { const z = ev.target.closest && ev.target.closest('[data-drop]'); if (z) z.classList.remove('over'); }));
  document.addEventListener('drop', (ev) => { const z = ev.target.closest && ev.target.closest('[data-drop]'); if (!z) return; ev.preventDefault(); if (ev.dataTransfer.files && ev.dataTransfer.files.length) readFiles(ev.dataTransfer.files); });
  window.addEventListener('dragover', (ev) => ev.preventDefault());
  window.addEventListener('drop', (ev) => ev.preventDefault());

  /* ================= inicio ================= */
  S = restore() || demoState();
  UI.page = S.sel && S.sel.cuenta ? 'conciliacion' : 'cargar';
  recompute();
  $('#btnNew').addEventListener('click', (ev) => {
    const btn = ev.currentTarget;
    if (!S.demo && S.archivos.length && !confirmInline(btn)) return;
    btn.textContent = 'Nueva conciliación';
    S = fresh(); UI.page = 'cargar'; UI.iaRev = null; UI.ai = {}; changed(); window.scrollTo(0, 0);
  });
  initCaps();
  render();
})();

</script>

<script>
if ('serviceWorker' in navigator && window.top === window.self && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
